version: 2

sources:
  - name: raw
    description: >
      CSV exports in data/raw/, one per source system, written by the simulator.
      Every column lands as text; the staging models own the types.
    config:
      meta:
        external_location: "read_csv('data/raw/{name}.csv', header = true, all_varchar = true)"
    tables:
      - name: regions
        description: Sales regions (Midwest metro markets) from the CRM.
      - name: ads_google_weekly
        description: >
          Google Ads weekly geo report. SEARCH rows split into brand and non-brand by
          campaign name; VIDEO rows are YouTube. Cost is in micros.
      - name: ads_meta_weekly
        description: Meta Ads weekly report by region name. Leads are what Meta claims.
      - name: ads_linkedin_weekly
        description: LinkedIn Ads weekly report by region code.
      - name: ads_display_weekly
        description: Programmatic display retargeting (DSP) weekly report, with post-click and post-view conversions.
      - name: ctv_weekly
        description: Connected TV platform weekly delivery by region, with the leads it attributes by household match.
      - name: partners_weekly
        description: Partner platform weekly placement and sponsor fees, clicks, and referred signups it claims.
      - name: webinar_events
        description: One row per regional webinar from the webinar tool, with total cost and registrants.
      - name: crm_leads
        description: CRM lead records with last-touch UTM source, medium and campaign, and the date each funnel stage was reached.
      - name: crm_opportunities
        description: CRM opportunities, one per converted lead, with amount, stage and close date.
      - name: sales_capacity_monthly
        description: Sales ops roster of SDRs and AEs by region and month.
      - name: email_weekly
        description: Email platform weekly sends, unique opens and unique clicks by region.
      - name: promo_calendar
        description: Pricing and promotion calendar from finance.
      - name: media_plan_changes
        description: Marketing's log of budget changes made between annual plans.
      - name: fleet_activity_index_weekly
        description: Weekly commercial fleet activity index, a market-demand signal.
